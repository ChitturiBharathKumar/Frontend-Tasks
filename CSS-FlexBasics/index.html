<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #one {
        height: 500px;
        width: 500px;
        border: 10px solid blue;
        border-radius: 50%;
        box-shadow: 0px 0px 100px 50px rgba(130, 244, 244, 0.73) inset;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #two {
        height: 300px;
        width: 300px;
        border: 10px solid red;
        border-radius: 50%;
        box-shadow: 0px 0px 100px 20px rgb(239, 136, 124) inset;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #three {
        height: 150px;
        width: 150px;
        border: 10px solid green;
        border-radius: 50%;
        text-align: center;
        font-weight: 900;
        font-size: 18px;
        color: navy;
        text-shadow: 3px 4px 5px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="one">
      <div id="two">
        <div id="three"><b>Fullstack Developer</b></div>
      </div>
    </div>
  </body>
</html>
