<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body {
            display: flex;
            margin:30px 300px;
        }
      #traffic {
        padding: 20px 100px;
        border: 3px solid black;
        border-radius: 20px;
        width: 250px;
        text-align: center;
      }
      #outer {
        height: 550px;
        width: 250px;
        background-color: black;
        padding-top: 15px;
        border-radius: 30px;
      }
      #red,
      #yellow,
      #green {
        height: 150px;
        width: 150px;
        border: 2px solid white;
        border-radius: 50%;
        margin: 20px auto;
        text-align: center;
        font-weight: bold;
        box-sizing: border-box;
        padding-top: 20%;
      }
      #red {
        background-color: red;
      }
      #yellow {
        background-color: yellow;
      }
      #green {
        background-color: green;
      }
      #poll {
        height: 100px;
        width: 20px;
        background-color: black;
        margin: 0px auto;
        padding: 0px;
      }
      #movie {
        width: 500px;
        text-align: center;
        border: 2px solid black;
        border-radius: 15px;
        margin: auto 200px;
      }
      img {
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="traffic">
      <div id="outer">
        <div id="red">STOP PROCRASTINAT</div>
        <div id="yellow">GET READY TO LEARN</div>
        <div id="green">START YOUR JOURNEY</div>
      </div>
      <div id="poll"></div>
      <p><b>FULLSTACK EXPERTS ACADEMY</b></p>
      <P>Learn &bull; Build &bull; Grow 🚀</P>
    </div>

    <div id="movie">
            <img src="https://d229kpbsb5jevy.cloudfront.net/sony4/0/bahubali_2_12dec_landscape_thumb.jpg" alt="" width="100%">
        <p style="font-size: 24px;"><b>Bahubali</b></p>
        <p>Rating: 4.5/5 &#11088;</p>
    </div>
  </body>
</html>
